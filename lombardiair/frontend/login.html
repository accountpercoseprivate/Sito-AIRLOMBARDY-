<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesso Servizi | LombardiAIR</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            forest: {
              950: '#04170E',
              900: '#0B2519',
              850: '#0E3021',
              800: '#14422D',
              700: '#1C5B3E',
            },
            lime: {
              400: '#A3E635',
              500: '#84CC16',
              600: '#65A30D',
            }
          },
          boxShadow: {
            'card-float': '0 25px 60px -15px rgba(11, 37, 25, 0.12), 0 0 1px 1px rgba(11, 37, 25, 0.05)',
            'cta-glow': '0 12px 28px -6px rgba(132, 204, 22, 0.45)',
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-full flex flex-col bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-lime-500 selection:text-forest-950">

  <!-- Header Istituzionale -->
  <header class="bg-forest-900 border-b border-white/10 sticky top-0 z-40 shadow-lg shadow-forest-950/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Brand Logo Vettoriale -->
      <a href="index.html" class="flex items-center space-x-3.5 group">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-forest-800 to-forest-950 p-2 border border-lime-500/30 flex items-center justify-center shadow-md">
          <svg viewBox="0 0 100 80" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 28C28 28 48 38 52 58C42 53 26 48 16 38C13 35 12 31 12 28Z" fill="#145A32"/>
            <path d="M18 38C34 38 52 48 55 63C45 58 30 53 22 45C19 42 18 40 18 38Z" fill="#27AE60"/>
            <path d="M25 48C38 48 53 55 58 68C48 63 35 58 28 53C26 51 25 49 25 48Z" fill="#A3E635"/>
            <path d="M52 58C68 32 88 28 92 38C96 48 82 68 58 68C70 65 80 54 78 44C74 34 60 42 52 58Z" fill="#A3E635"/>
            <path d="M64 40L68 34L70 35L68 40L75 42L77 41L78 42L75 45L72 49L70 49L71 45L65 43L63 45L62 44L64 40Z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight text-white block leading-none">Lombardi<span class="text-lime-400">AIR</span></span>
          <span class="text-[9px] uppercase tracking-widest text-slate-400 font-bold block mt-1">Portale Istituzionale di Accesso</span>
        </div>
      </a>

      <a href="index.html" class="text-xs font-bold text-slate-300 hover:text-lime-400 transition flex items-center space-x-1">
        <span>← Torna alla Ricerca Voli</span>
      </a>
    </div>
  </header>

  <!-- Contenitore Form Autenticazione -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-card-float border border-slate-200/90 p-8 sm:p-10">
      
      <!-- Selettore Tab -->
      <div class="flex p-1.5 rounded-2xl bg-slate-100 border border-slate-200 mb-8">
        <button id="tab-login" class="flex-1 py-2.5 rounded-xl bg-forest-900 text-white text-xs font-extrabold shadow-sm transition-all">
          Accedi
        </button>
        <button id="tab-register" class="flex-1 py-2.5 rounded-xl text-slate-500 hover:text-slate-900 text-xs font-bold transition-all">
          Nuovo Passeggero
        </button>
      </div>

      <!-- Box Messaggi Feedback -->
      <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-bold leading-relaxed border transition-all"></div>

      <!-- FORM LOGIN -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Email Registrata</label>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="nome@dominio.it" 
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
          />
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
          <input 
            type="password" 
            id="login-password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
          />
        </div>
        <button 
          type="submit" 
          id="btn-submit-login" 
          class="w-full py-3.5 mt-2 rounded-2xl bg-lime-500 hover:bg-lime-400 active:bg-lime-600 text-forest-950 font-black text-xs uppercase tracking-wider shadow-cta-glow transition-all"
        >
          Accedi ai Servizi
        </button>
      </form>

      <!-- FORM REGISTRAZIONE -->
      <form id="form-register" class="space-y-4 hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Nome</label>
            <input 
              type="text" 
              id="reg-nome" 
              required 
              placeholder="Mario" 
              class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
            />
          </div>
          <div>
            <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Cognome</label>
            <input 
              type="text" 
              id="reg-cognome" 
              required 
              placeholder="Rossi" 
              class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
            />
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Indirizzo Email</label>
          <input 
            type="email" 
            id="reg-email" 
            required 
            placeholder="mario.rossi@email.it" 
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
          />
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Crea Password</label>
          <input 
            type="password" 
            id="reg-password" 
            required 
            minlength="6" 
            placeholder="Minimo 6 caratteri" 
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:bg-white transition"
          />
        </div>
        <button 
          type="submit" 
          id="btn-submit-reg" 
          class="w-full py-3.5 mt-2 rounded-2xl bg-lime-500 hover:bg-lime-400 active:bg-lime-600 text-forest-950 font-black text-xs uppercase tracking-wider shadow-cta-glow transition-all"
        >
          Completa Registrazione
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400 font-medium">
          Autenticazione sicura crittografata con standard regionale Supabase.
        </p>
      </div>

    </div>
  </main>

  <footer class="bg-forest-950 text-slate-400 border-t border-white/10 py-6 mt-auto text-center text-xs">
    © 2026 LombardiAIR S.p.A. - Tutti i diritti riservati.
  </footer>

  <!-- Script di Gestione Interfaccia & Redirect Intelligente -->
  <script type="module">
    import { login, register, getUserProfile } from './js/auth.js';

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const alertBox = document.getElementById('alert-box');

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = `mb-6 p-4 rounded-2xl text-xs font-bold leading-relaxed border transition-all ${
        isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    // Gestione Switcher Tab
    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 py-2.5 rounded-xl bg-forest-900 text-white text-xs font-extrabold shadow-sm transition-all';
      tabRegister.className = 'flex-1 py-2.5 rounded-xl text-slate-500 hover:text-slate-900 text-xs font-bold transition-all';
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 py-2.5 rounded-xl bg-forest-900 text-white text-xs font-extrabold shadow-sm transition-all';
      tabLogin.className = 'flex-1 py-2.5 rounded-xl text-slate-500 hover:text-slate-900 text-xs font-bold transition-all';
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    // Submit Login con Redirect Corretto all'Area Passeggero
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-submit-login');

      try {
        btn.disabled = true;
        btn.textContent = 'Verifica in corso...';
        await login(email, password);
        
        const profile = await getUserProfile();
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        if (redirect) {
          window.location.href = redirect;
        } else if (profile?.ruolo === 'admin') {
          window.location.href = 'admin.html';
        } else {
          // Reindirizza il cittadino / passeggero direttamente alla sua dashboard
          window.location.href = 'passenger-dashboard.html';
        }
      } catch (err) {
        showAlert(err.message || 'Credenziali non valide.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Accedi ai Servizi';
      }
    });

    // Submit Registrazione
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('reg-nome').value;
      const cognome = document.getElementById('reg-cognome').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-submit-reg');

      try {
        btn.disabled = true;
        btn.textContent = 'Creazione profilo...';
        await register(email, password, nome, cognome);
        showAlert('Registrazione completata con successo! Ora puoi accedere.');
        tabLogin.click();
      } catch (err) {
        showAlert(err.message || 'Errore durante la registrazione.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Completa Registrazione';
      }
    });
  </script>
</body>
</html>
